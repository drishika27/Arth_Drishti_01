# Render Blueprint — New > Blueprint > pick this repo.
# Creates: a Postgres database, the API (FastAPI) and the web app (static React build).
databases:
  - name: arth-drishti-db
    plan: free            # Render's free Postgres expires after 30 days; upgrade for real use.
    databaseName: arthdrishti

services:
  - type: web
    name: arth-drishti-api
    runtime: python
    plan: free            # If it runs out of memory (the OCR engine is the heavy part), use "starter".
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn arth_bodh.backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: ARTHDRISHTI_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: arth-drishti-db
          property: connectionString
      # Set to the web app's URL after the first deploy, e.g. https://arth-drishti-app.onrender.com
      - key: CORS_ALLOW_ORIGINS
        sync: false
      # Optional: enables Claude vision OCR + worded AI answers. Works without it.
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: arth-drishti-app
    runtime: static
    rootDir: arth_bodh/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Set to the API's URL, e.g. https://arth-drishti-api.onrender.com  (then redeploy the app)
      - key: VITE_ARTH_BODH_API
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
